# Scrapes the /metrics endpoint every GoCart service already serves. The metrics
# carry their own `service` label, so the targets need no relabelling.
global:
  scrape_interval: 5s      # short, so the outage demo is visible as it happens
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: gocart
    static_configs:
      - targets:
          - product-service:8080
          - order-service:8081
          - payment-service:8082
          - cart-service:8083
          - web-service:3000
