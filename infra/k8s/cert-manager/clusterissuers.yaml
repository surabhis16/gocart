# Applied once per cluster, after installing cert-manager (docs/operations.md).
# The self-signed issuer is what the local overlays use: HTTPS works, and the
# browser warns once because nothing it trusts vouches for the certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: gocart-selfsigned
spec:
  selfSigned: {}
