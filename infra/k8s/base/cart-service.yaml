# Cart service. One replica, on purpose: carts are a single file with one
# writer. Unlike Payment, nothing here is money: a lost cart is an annoyance,
# and checkout's safety comes from the Order service's idempotency, not from
# anything in this process. Scaling out means moving carts to a shared store.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cart-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: shopping
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart-service
        app.kubernetes.io/component: shopping
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: cart-service
          image: gocart/cart-service:0.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - { name: PORT, value: "8083" }
            - { name: DATA_DIR, value: /data }
            - { name: LOG_LEVEL, value: info }
            - { name: IDENTITY_SECRET, valueFrom: { secretKeyRef: { name: gocart-auth, key: identity-secret } } }
            - { name: REQUIRE_IDENTITY, value: "true" }
            - { name: PRODUCT_URL, value: "http://product-service:8080" }
            - { name: ORDER_URL, value: "http://order-service:8081" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cart-data
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  labels:
    app.kubernetes.io/name: cart-service
spec:
  selector:
    app.kubernetes.io/name: cart-service
  ports:
    - { name: http, port: 8083, targetPort: http }
