# Prometheus and Grafana for GoCart. Optional: add it to the normal stack with
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
#   (or: make observe)
#
# Grafana:    http://localhost:3001   (user admin, password GRAFANA_ADMIN_PASSWORD, default gocart-demo)
# Prometheus: http://localhost:9090
#
# Both listen on this machine only. To reach them from elsewhere (a VM, say) set
# OBSERVE_BIND=0.0.0.0 and change the Grafana password first.
name: gocart

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "${OBSERVE_BIND:-127.0.0.1}:9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-gocart-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gocart.json
    ports:
      - "${OBSERVE_BIND:-127.0.0.1}:3001:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
